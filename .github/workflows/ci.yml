# Continuous integration (discovery §17, P1.5; ADR-0013 §4–5).
#
# Every third-party action is pinned by commit SHA, with its release as a comment;
# scripts/check-pins.sh enforces it and .github/dependabot.yml proposes the updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it widens it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    name: Pinned images and actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-pins.sh

  # The build is three jobs side by side, and a fourth that says whether all three ended well.
  checks:
    name: Format, boundaries and what production reaches
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before anything is downloaded: every class, member and test that the table of decisions of
      # the discovery names is in the repository (section 22, scripts/check_decisions.py).
      - name: Table of decisions
        run: python3 -I scripts/check_decisions.py
      # The JDK, sbt, and the cache of what sbt downloads. This job is the one that saves it: it
      # resolves the whole build, compiles every module with its tests (checkUnconnected reads
      # both), and is the one that fetches scalafmt, which `update` does not.
      - uses: ./.github/actions/setup-build
        with:
          save-cache: "true"
      # sbt itself, the plugins and every library, before anything is compiled: the one step
      # that needs Maven Central, and the one that is tried again if it answers 429.
      - name: Resolve the build
        run: scripts/retry-on-429.sh sbt -batch update
      - run: sbt -batch scalafmtCheckAll scalafmtSbtCheck checkBoundaries checkUnconnected

  # The modules whose tests need no service: configuration, planning, the model of the control
  # plane, the LogStore with every fault injected in one JVM, and the engine's own.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Resolve the build
        run: scripts/retry-on-429.sh sbt -batch update
      # Every module but integration-tests, which the job below runs: a module added to the build
      # is added to one of the two.
      - run: sbt -batch core/test delta-pg-logstore/test engine/test cli/test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-unit
          path: modules/*/target/test-reports/
          retention-days: 7
          if-no-files-found: ignore

  # Every component against a real PostgreSQL (Testcontainers; Docker is on the runner), real
  # Delta and real files. Stress runs are tagged and left out (`sbt stress`).
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Resolve the build
        run: scripts/retry-on-429.sh sbt -batch update
      - run: sbt -batch integration-tests/test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-integration
          path: modules/*/target/test-reports/
          retention-days: 7
          if-no-files-found: ignore

  # The check that main requires, under the name that it had when it was one job. It runs
  # whatever the three jobs ended in (`always()`), and fails unless each of them succeeded: a
  # job that is skipped counts as passed for a required check, so one that only ran when they
  # succeeded would be skipped when one of them failed, and let the pull request through.
  build:
    name: Format, boundaries, compile and test
    if: always()
    needs: [checks, unit-tests, integration-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Each part of the build succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS: ${{ needs.integration-tests.result }}
        run: |
          echo "checks: $CHECKS; unit tests: $UNIT_TESTS; integration tests: $INTEGRATION_TESTS"
          [[ "$CHECKS" == success && "$UNIT_TESTS" == success && "$INTEGRATION_TESTS" == success ]]

  # Dependency scanning (ADR-0013 §4). GitHub does not read sbt builds, so the resolved graph is
  # submitted (scripts/dependency-snapshot.sh); Dependabot alerts and the review below work from it. Both need the repository to
  # be public, and the submission needs a write token, which pull requests from forks lack.
  dependency-graph:
    name: Dependency submission
    if: >-
      !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the dependency submission API requires it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same setup, and the same cache, as the jobs of the build. It reads the cache and does
      # not save it: the job of the checks saves it, whole.
      - uses: ./.github/actions/setup-build
      - name: Test the scripts
        run: python3 -I -B -m unittest discover -s scripts
      # One manifest for the whole build: per-project manifests all point at build.sbt, and
      # dependency review then saw unchanged libraries as removed and added
      # (scripts/merge_dependency_manifests.py). The script resolves the build, and tries again
      # if Maven Central answers 429 (scripts/retry-on-429.sh).
      - name: Generate the dependency snapshot
        env:
          # On a pull request GITHUB_SHA is the merge commit; dependency review looks up the head.
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SNAPSHOT_REF: ${{ github.ref }}
          # The correlator the scalacenter action used, so that this snapshot replaces the one
          # already on main instead of being added next to it.
          SNAPSHOT_CORRELATOR: CI_dependency-graph___scalacenter_sbt-dependency-submission
        run: scripts/dependency-snapshot.sh "$RUNNER_TEMP/dependency-snapshot.json"
      - name: Submit the dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 3
          --request POST
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
          --data "@$RUNNER_TEMP/dependency-snapshot.json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/snapshots"

  # The gate: a pull request may not introduce a dependency with a known vulnerability of high
  # severity or above, in any scope. Existing alerts are triaged instead (ADR-0013 §4).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    needs: dependency-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          # The snapshot for the pull request's head is submitted by the job above.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
