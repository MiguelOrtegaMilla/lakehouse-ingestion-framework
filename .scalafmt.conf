version = 3.11.5
runner.dialect = scala213

maxColumn = 100

# Vertical alignment produces diff noise when one line changes; keep it off.
align.preset = none

docstrings.style = Asterisk
docstrings.wrap = false

rewrite.rules = [Imports, RedundantParens, SortModifiers]
rewrite.imports.expand = false
rewrite.imports.sort = scalastyle

fileOverride {
  "glob:**/*.sbt" { runner.dialect = sbt1 }
  "glob:**/project/*.scala" { runner.dialect = scala212 }
}
