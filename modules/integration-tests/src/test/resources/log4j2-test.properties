rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %c{1} - %msg%n

# Container start-up and image pulls are worth seeing when a suite is slow or fails.
logger.testcontainers.name = org.testcontainers
logger.testcontainers.level = info
