rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %c{1} - %msg%n

# Container start-up and image pulls are worth seeing when a suite is slow or fails.
logger.testcontainers.name = org.testcontainers
logger.testcontainers.level = info

# Spark start-up noise that says nothing about the test: no native Hadoop library (expected on a
# dev machine; Spark falls back to Java), and plan strings truncated in Spark's own messages.
logger.hadoopNative.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoopNative.level = error
logger.sparkStrings.name = org.apache.spark.util.SparkStringUtils
logger.sparkStrings.level = error

# The pool reports, with a stack trace, every connection it drops as broken. The fault tests
# break connections on purpose; what they assert is the error the caller gets.
logger.hikariBroken.name = com.zaxxer.hikari.pool.ProxyConnection
logger.hikariBroken.level = error
