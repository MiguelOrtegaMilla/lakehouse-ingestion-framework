# Testcontainers settings for this build, read from the test classpath (ADR-0013 §5).
#
# Ryuk, the sidecar that removes containers after the test JVM exits, pinned by digest. It runs
# with the Docker socket mounted, so it is the most privileged container of a test run.
# The tag is the one the Testcontainers version in project/Dependencies.scala expects
# (RyukContainer). Upgrading Testcontainers: re-pin it here, with the multi-arch index digest
# from `docker buildx imagetools inspect testcontainers/ryuk:<tag>`.
# An environment variable or ~/.testcontainers.properties still overrides this file.
ryuk.container.image=testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
