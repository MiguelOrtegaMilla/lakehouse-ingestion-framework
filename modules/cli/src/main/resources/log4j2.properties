# The log of the command line: everything to the error output, at INFO, in the pattern of
# Spark's own default (org/apache/spark/log4j2-defaults.properties).
#
# The standard output of a command is what it writes for whoever reads it, and nothing else:
# the records of `quarantine --records`, as JSON Lines, among them. Without a configuration of
# its own, log4j2 logs only errors, and to the standard output, until Spark sets its default
# the first time that it logs: what a command logs before then is lost, or among its records.
#
# What univocity, Spark's parser of CSV, parsed of a value too long is taken out of every line,
# of its message and of its stack trace: its failure says it after "content parsed=", which is
# a value of the source, up to 1003 characters ("..." and the last 1000 that it parsed), and
# Spark logs it at WARN and at ERROR with each task that fails (SparkCsvValueBoundContractSpec).
# The 1003 characters after the marker are taken, whatever they are, and not up to where the
# value seems to end: a value may hold what looks like the end of one. All but the ends of line
# that close what was taken: the end of the line of the event among them, so that the next
# event starts a line of its own.
#
# A deployment may give another configuration with -Dlog4j2.configurationFile: it is to have
# this replacement, and alwaysWriteExceptions off, or a stack trace is written again whole
# after the pattern. Below INFO, Parquet logs each value that it writes
# (docs/operations/running-a-source.md).
rootLogger.level = info
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.alwaysWriteExceptions = false
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %replace{%m%n%ex}{(?s)content parsed=.{0,1003}(?<![\\r\\n])}{content parsed=<not logged>}
