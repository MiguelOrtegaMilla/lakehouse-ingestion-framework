id: crm.customers
connector:
  type: jdbc
  connection:
    url: "jdbc:postgresql://localhost:5432/crm"
    user: reader
    password: { secretRef: "env:READER_PASSWORD" }
    tls: { mode: disable }
  table: crm.public.customers
load: { mode: incremental }
targets:
  bronze: { table: bronze/crm/customers }
