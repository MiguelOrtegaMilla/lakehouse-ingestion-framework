id: crm_es.customers
connector:
  type: jdbc
  connection:
    url: "jdbc:postgresql://localhost:5432/crm"
    user: reader
    password: { secretRef: "env:READER_PASSWORD" }
    tls: { mode: disable }
  table: customers
load: { mode: full }
keys: [customer_id]
targets:
  bronze: { table: bronze/crm_es/customers }
  silver: { table: silver/crm/customers, partition_by: [_source_id] }
